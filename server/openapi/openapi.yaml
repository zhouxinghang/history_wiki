components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-history_wiki_session
  parameters:
    EntityId:
      name: entityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    From:
      name: from
      in: query
      required: true
      schema: { type: number }
    To:
      name: to
      in: query
      required: true
      schema: { type: number }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: 必须与 Secure CSRF Cookie 一致，并与当前服务端 Session 绑定。
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一账号和写操作范围内唯一；重试时必须复用相同值与相同请求内容。
      schema: { type: string, minLength: 1, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 使用最近一次资源响应中的强 ETag，例如 `"1"`。
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    EventIfMatch:
      name: If-Match
      in: header
      required: true
      description: 历史事件元数据的强 ETag，例如 `"event-3"`。
      schema: { type: string, pattern: '^"event-[1-9][0-9]*"$' }
    DraftIfMatch:
      name: If-Match
      in: header
      required: true
      description: 活动草稿的强 ETag，例如 `"draft-7"`。
      schema: { type: string, pattern: '^"draft-[1-9][0-9]*"$' }
    EntityQuery:
      name: q
      in: query
      schema: { type: string, maxLength: 100 }
      description: 在当前名称和消歧名称中执行不区分拉丁文字大小写的子串搜索。
    EntityStatus:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/CanonicalEntityStatus" }
    EntityLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: JSON 请求体超过此操作允许的 2 MiB 或 20 MiB 上限
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: 请求超过约定速率
      headers:
        Retry-After:
          description: 建议重试前等待的秒数
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    PublicationStatus:
      type: string
      enum: [unpublished, published, archived]
    ManagedEvent:
      type: object
      additionalProperties: false
      required: [id, slug, publicationStatus, lockVersion, draft, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 120 }
        publicationStatus: { $ref: "#/components/schemas/PublicationStatus" }
        lockVersion: { type: integer, format: int64, minimum: 1 }
        draft:
          oneOf:
            - $ref: "#/components/schemas/ManagedEventDraft"
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ManagedEventListResponse:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/ManagedEvent" }
    ManagedEventDraft:
      type: object
      additionalProperties: false
      required: [title, summary, narrative, time, primaryCategory, prominence, displayOrder, regions, places, periods, figures, topicTags, lockVersion, basedOnRevisionNo, createdAt, updatedAt]
      properties:
        title: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 1000 }
        narrative: { type: string, maxLength: 100000 }
        time:
          oneOf:
            - $ref: "#/components/schemas/TimeExpression"
            - type: "null"
        primaryCategory:
          oneOf:
            - $ref: "#/components/schemas/PrimaryCategory"
            - type: "null"
        prominence:
          oneOf:
            - $ref: "#/components/schemas/EventProminence"
            - type: "null"
        displayOrder: { type: integer, minimum: -1000000, maximum: 1000000 }
        regions: { type: array, items: { $ref: "#/components/schemas/CanonicalEntityReference" } }
        places: { type: array, items: { $ref: "#/components/schemas/CanonicalEntityReference" } }
        periods: { type: array, items: { $ref: "#/components/schemas/CanonicalEntityReference" } }
        figures: { type: array, items: { $ref: "#/components/schemas/CanonicalEntityReference" } }
        topicTags: { type: array, items: { $ref: "#/components/schemas/CanonicalEntityReference" } }
        lockVersion: { type: integer, format: int64, minimum: 1 }
        basedOnRevisionNo:
          type: [integer, "null"]
          minimum: 1
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EventRevisionPublisher:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
    ManagedEventRevisionSummary:
      type: object
      additionalProperties: false
      required: [id, revisionNo, title, publishedBy, publishedAt, current]
      properties:
        id: { type: string, format: uuid }
        revisionNo: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        publishedBy: { $ref: "#/components/schemas/EventRevisionPublisher" }
        publishedAt: { type: string, format: date-time }
        current: { type: boolean }
    ManagedEventRevisionListResponse:
      type: object
      additionalProperties: false
      required: [revisions]
      properties:
        revisions:
          type: array
          items: { $ref: "#/components/schemas/ManagedEventRevisionSummary" }
    ManagedEventRevision:
      type: object
      additionalProperties: false
      required: [id, eventId, revisionNo, title, summary, narrative, time, primaryCategory, prominence, displayOrder, regions, places, periods, figures, topicTags, publishedBy, publishedAt, current]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        revisionNo: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: string, minLength: 1, maxLength: 1000 }
        narrative: { type: string, minLength: 1, maxLength: 100000 }
        time: { $ref: "#/components/schemas/TimeExpression" }
        primaryCategory: { $ref: "#/components/schemas/PrimaryCategory" }
        prominence: { $ref: "#/components/schemas/EventProminence" }
        displayOrder: { type: integer, minimum: -1000000, maximum: 1000000 }
        regions: { type: array, items: { $ref: "#/components/schemas/CanonicalEntityReference" } }
        places: { type: array, items: { $ref: "#/components/schemas/CanonicalEntityReference" } }
        periods: { type: array, items: { $ref: "#/components/schemas/CanonicalEntityReference" } }
        figures: { type: array, items: { $ref: "#/components/schemas/CanonicalEntityReference" } }
        topicTags: { type: array, items: { $ref: "#/components/schemas/CanonicalEntityReference" } }
        publishedBy: { $ref: "#/components/schemas/EventRevisionPublisher" }
        publishedAt: { type: string, format: date-time }
        current: { type: boolean }
    EventDraftWriteInput:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200, default: "" }
        summary: { type: string, maxLength: 1000, default: "" }
        narrative: { type: string, maxLength: 100000, default: "" }
        time:
          oneOf:
            - $ref: "#/components/schemas/TimeExpression"
            - type: "null"
        primaryCategory:
          oneOf:
            - $ref: "#/components/schemas/PrimaryCategory"
            - type: "null"
        prominence:
          oneOf:
            - $ref: "#/components/schemas/EventProminence"
            - type: "null"
        displayOrder: { type: integer, minimum: -1000000, maximum: 1000000, default: 1000 }
        regionIds: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid }, default: [] }
        placeIds: { type: array, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid }, default: [] }
        periodIds: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid }, default: [] }
        figureIds: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid }, default: [] }
        topicTagIds: { type: array, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid }, default: [] }
    CreateManagedEventRequest:
      type: object
      additionalProperties: false
      required: [slug]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 120 }
        title: { type: string, maxLength: 200, default: "" }
        summary: { type: string, maxLength: 1000, default: "" }
        narrative: { type: string, maxLength: 100000, default: "" }
        time:
          oneOf:
            - $ref: "#/components/schemas/TimeExpression"
            - type: "null"
        primaryCategory:
          oneOf:
            - $ref: "#/components/schemas/PrimaryCategory"
            - type: "null"
        prominence:
          oneOf:
            - $ref: "#/components/schemas/EventProminence"
            - type: "null"
        displayOrder: { type: integer, minimum: -1000000, maximum: 1000000, default: 1000 }
        regionIds: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid }, default: [] }
        placeIds: { type: array, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid }, default: [] }
        periodIds: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid }, default: [] }
        figureIds: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid }, default: [] }
        topicTagIds: { type: array, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid }, default: [] }
    EventImportRecord:
      type: object
      additionalProperties: false
      required: [id, slug]
      properties:
        id:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          description: 调用方提供的不可变 UUIDv7；导入不会自动替换标识。
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 120 }
        title: { type: string, maxLength: 200, default: "" }
        summary: { type: string, maxLength: 1000, default: "" }
        narrative: { type: string, maxLength: 100000, default: "" }
        time:
          oneOf:
            - $ref: "#/components/schemas/TimeExpression"
            - type: "null"
        primaryCategory:
          oneOf:
            - $ref: "#/components/schemas/PrimaryCategory"
            - type: "null"
        prominence:
          oneOf:
            - $ref: "#/components/schemas/EventProminence"
            - type: "null"
        displayOrder: { type: integer, minimum: -1000000, maximum: 1000000, default: 1000 }
        regionIds: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid }, default: [] }
        placeIds: { type: array, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid }, default: [] }
        periodIds: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid }, default: [] }
        figureIds: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid }, default: [] }
        topicTagIds: { type: array, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid }, default: [] }
    EventImportRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: "#/components/schemas/EventImportRecord" }
    EventImportIssue:
      type: object
      additionalProperties: false
      required: [index, field, code, detail]
      properties:
        index: { type: integer, minimum: 0, description: events 数组中的零基下标 }
        field: { type: string }
        code: { type: string }
        detail: { type: string }
    EventImportValidation:
      type: object
      additionalProperties: false
      required: [valid, total, errors]
      properties:
        valid: { type: boolean }
        total: { type: integer, minimum: 0, maximum: 10000 }
        errors:
          type: array
          items: { $ref: "#/components/schemas/EventImportIssue" }
    EventImportBatch:
      type: object
      additionalProperties: false
      required: [batchId, importedCount, eventIds, createdAt]
      properties:
        batchId: { type: string, format: uuid }
        importedCount: { type: integer, minimum: 1, maximum: 10000 }
        eventIds:
          type: array
          minItems: 1
          maxItems: 10000
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    UpdateManagedEventSlugRequest:
      type: object
      additionalProperties: false
      required: [slug]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 120 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 1024 }
    UserRole:
      type: string
      enum: [editor, administrator]
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/CurrentUser" }
    ManagedUser:
      type: object
      additionalProperties: false
      required: [id, email, role, disabledAt, lockVersion, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        disabledAt:
          type: [string, "null"]
          format: date-time
        lockVersion: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ManagedUserListResponse:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/ManagedUser" }
    CreateManagedUserRequest:
      type: object
      additionalProperties: false
      required: [email, password, role]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 1024 }
        role: { $ref: "#/components/schemas/UserRole" }
    UpdateManagedUserRequest:
      type: object
      additionalProperties: false
      required: [role, disabled]
      properties:
        role: { $ref: "#/components/schemas/UserRole" }
        disabled: { type: boolean }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 12, maxLength: 1024 }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 1024 }
        newPassword: { type: string, minLength: 12, maxLength: 1024 }
    CanonicalEntityStatus:
      type: string
      enum: [active, inactive, merged]
    Region:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - disambiguationLabel
        - status
        - mergedIntoId
        - lockVersion
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        disambiguationLabel:
          type: [string, "null"]
          maxLength: 120
        status: { $ref: "#/components/schemas/CanonicalEntityStatus" }
        mergedIntoId: { type: [string, "null"], format: uuid }
        lockVersion: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RegionListResponse:
      type: object
      additionalProperties: false
      required: [regions]
      properties:
        regions:
          type: array
          items: { $ref: "#/components/schemas/Region" }
    CreateRegionRequest:
      type: object
      additionalProperties: false
      required: [name, disambiguationLabel]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        disambiguationLabel:
          type: [string, "null"]
          maxLength: 120
    UpdateRegionRequest:
      type: object
      additionalProperties: false
      required: [name, disambiguationLabel, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        disambiguationLabel:
          type: [string, "null"]
          maxLength: 120
        status:
          type: string
          enum: [active, inactive]
    ManagedCanonicalEntity:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - disambiguationLabel
        - status
        - mergedIntoId
        - lockVersion
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        disambiguationLabel:
          type: [string, "null"]
          maxLength: 120
        status: { $ref: "#/components/schemas/CanonicalEntityStatus" }
        mergedIntoId: { type: [string, "null"], format: uuid }
        lockVersion: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    HistoricalFigure:
      $ref: "#/components/schemas/ManagedCanonicalEntity"
    TopicTag:
      $ref: "#/components/schemas/ManagedCanonicalEntity"
    HistoricalFigureListResponse:
      type: object
      additionalProperties: false
      required: [figures]
      properties:
        figures:
          type: array
          items: { $ref: "#/components/schemas/HistoricalFigure" }
    TopicTagListResponse:
      type: object
      additionalProperties: false
      required: [topicTags]
      properties:
        topicTags:
          type: array
          items: { $ref: "#/components/schemas/TopicTag" }
    CreateCanonicalEntityRequest:
      type: object
      additionalProperties: false
      required: [name, disambiguationLabel]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        disambiguationLabel:
          type: [string, "null"]
          maxLength: 120
    UpdateCanonicalEntityRequest:
      type: object
      additionalProperties: false
      required: [name, disambiguationLabel, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        disambiguationLabel:
          type: [string, "null"]
          maxLength: 120
        status:
          type: string
          enum: [active, inactive]
    ContextEntity:
      type: object
      additionalProperties: false
      required: [id, name, disambiguationLabel, status, mergedIntoId, regions, lockVersion, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        disambiguationLabel: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/CanonicalEntityStatus" }
        mergedIntoId: { type: [string, "null"], format: uuid }
        regions:
          type: array
          items: { $ref: "#/components/schemas/CanonicalEntityReference" }
        lockVersion: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlaceListResponse:
      type: object
      additionalProperties: false
      required: [places]
      properties:
        places:
          type: array
          items: { $ref: "#/components/schemas/ContextEntity" }
    HistoricalPeriodListResponse:
      type: object
      additionalProperties: false
      required: [periods]
      properties:
        periods:
          type: array
          items: { $ref: "#/components/schemas/ContextEntity" }
    CreateContextEntityRequest:
      type: object
      additionalProperties: false
      required: [name, disambiguationLabel, regionIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        disambiguationLabel: { type: [string, "null"], maxLength: 120 }
        regionIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    CreateHistoricalPeriodRequest:
      allOf:
        - $ref: "#/components/schemas/CreateContextEntityRequest"
        - type: object
          properties:
            regionIds:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, format: uuid }
    UpdateContextEntityRequest:
      type: object
      additionalProperties: false
      required: [name, disambiguationLabel, status, regionIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        disambiguationLabel: { type: [string, "null"], maxLength: 120 }
        status: { type: string, enum: [active, inactive] }
        regionIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    EntityMergeImpact:
      type: object
      additionalProperties: false
      required: [draftCount, revisionCount, publishedEventCount]
      properties:
        draftCount: { type: integer, minimum: 0 }
        revisionCount: { type: integer, minimum: 0 }
        publishedEventCount: { type: integer, minimum: 0 }
    MergeCanonicalEntityRequest:
      type: object
      additionalProperties: false
      required: [targetId, confirmedImpact]
      properties:
        targetId: { type: string, format: uuid }
        confirmedImpact: { $ref: "#/components/schemas/EntityMergeImpact" }
    MergeCanonicalEntityResponse:
      type: object
      additionalProperties: false
      required: [entity, impact]
      properties:
        entity: { $ref: "#/components/schemas/ManagedCanonicalEntity" }
        impact: { $ref: "#/components/schemas/EntityMergeImpact" }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    ReadinessResponse:
      type: object
      required: [status, migrationVersion]
      properties:
        status: { type: string, const: ready }
        migrationVersion: { type: integer, format: int64 }
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        requestId: { type: string }
    EventBounds:
      oneOf:
        - type: object
          required: [hasEvents, start, end]
          properties:
            hasEvents: { type: boolean, const: false }
            start: { type: "null" }
            end: { type: "null" }
        - type: object
          required: [hasEvents, start, end]
          properties:
            hasEvents: { type: boolean, const: true }
            start: { type: number }
            end: { type: number }
    EventFilterMetadata:
      type: object
      required: [periodGroups, regions, figures, primaryCategories]
      properties:
        periodGroups:
          type: array
          items:
            type: object
            required: [context, periods]
            properties:
              context: { $ref: "#/components/schemas/CanonicalEntityReference" }
              periods:
                type: array
                items: { $ref: "#/components/schemas/CanonicalEntityReference" }
        regions:
          type: array
          items: { $ref: "#/components/schemas/CanonicalEntityReference" }
        figures:
          type: array
          items: { $ref: "#/components/schemas/CanonicalEntityReference" }
        primaryCategories:
          type: array
          items: { $ref: "#/components/schemas/PrimaryCategory" }
    EventQueryResult:
      type: object
      required: [events, sourceTotal, totalMatching, returnedProminence]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/HistoricalEvent" }
        sourceTotal: { type: integer, minimum: 0 }
        totalMatching: { type: integer, minimum: 0 }
        returnedProminence: { $ref: "#/components/schemas/EventProminence" }
    HistoricalEvent:
      type: object
      required:
        - id
        - slug
        - title
        - summary
        - narrative
        - time
        - primaryCategory
        - periods
        - regions
        - places
        - figures
        - topicTags
        - prominence
        - displayOrder
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        narrative: { type: string }
        time: { $ref: "#/components/schemas/TimeExpression" }
        primaryCategory: { $ref: "#/components/schemas/PrimaryCategory" }
        periods:
          type: array
          items: { $ref: "#/components/schemas/CanonicalEntityReference" }
        regions:
          type: array
          items: { $ref: "#/components/schemas/CanonicalEntityReference" }
        places:
          type: array
          items: { $ref: "#/components/schemas/CanonicalEntityReference" }
        figures:
          type: array
          items: { $ref: "#/components/schemas/CanonicalEntityReference" }
        topicTags:
          type: array
          items: { $ref: "#/components/schemas/CanonicalEntityReference" }
        prominence: { $ref: "#/components/schemas/EventProminence" }
        displayOrder: { type: integer }
    CanonicalEntityReference:
      type: object
      required: [id, name, disambiguationLabel]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        disambiguationLabel:
          type: [string, "null"]
    TimeExpression:
      oneOf:
        - $ref: "#/components/schemas/ExactDateExpression"
        - $ref: "#/components/schemas/YearExpression"
        - $ref: "#/components/schemas/CircaExpression"
        - $ref: "#/components/schemas/IntervalExpression"
      discriminator:
        propertyName: kind
    HistoricalYear:
      type: object
      required: [era, year]
      properties:
        era: { type: string, enum: [BCE, CE] }
        year: { type: integer, minimum: 1, maximum: 999999 }
    ExactDateExpression:
      type: object
      required: [kind, date]
      properties:
        kind: { type: string, const: exact-date }
        date:
          allOf:
            - $ref: "#/components/schemas/HistoricalYear"
            - type: object
              required: [month, day]
              properties:
                month: { type: integer, minimum: 1, maximum: 12 }
                day: { type: integer, minimum: 1, maximum: 31 }
    YearExpression:
      type: object
      required: [kind, year]
      properties:
        kind: { type: string, const: year }
        year: { $ref: "#/components/schemas/HistoricalYear" }
    CircaExpression:
      type: object
      required: [kind, year]
      properties:
        kind: { type: string, const: circa }
        year: { $ref: "#/components/schemas/HistoricalYear" }
    IntervalExpression:
      type: object
      required: [kind, start, end]
      properties:
        kind: { type: string, const: interval }
        start:
          allOf:
            - $ref: "#/components/schemas/HistoricalYear"
            - type: object
              properties:
                circa: { type: boolean }
        end:
          allOf:
            - $ref: "#/components/schemas/HistoricalYear"
            - type: object
              properties:
                circa: { type: boolean }
    PrimaryCategory:
      type: string
      enum: [政治, 军事, 文化, 科技, 社会, 交流]
    EventProminence:
      type: integer
      enum: [1, 2, 3]
