openapi: 3.1.0
info:
  title: History Wiki API
  version: 0.1.0
  description: 历史 Wiki 的公开读者 API。空数据库行为是本契约的一等状态。
  license:
    name: Unlicensed
servers:
  - url: /
security: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: 检查服务进程是否存活
      responses:
        "200":
          description: 服务进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: 检查数据库连接和迁移版本是否就绪
      responses:
        "200":
          description: 服务已就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/Problem"
  /metrics:
    get:
      operationId: getMetrics
      summary: 导出 Prometheus 文本指标
      description: 仅供受网络策略保护的监控系统访问，不包含用户、历史事件或查询字符串等高基数标签。
      responses:
        "200":
          description: Prometheus exposition format
          content:
            text/plain:
              schema: { type: string }
  /api/v1/event-bounds:
    get:
      operationId: getEventBounds
      summary: 查询全部已发布历史事件的时间边界
      responses:
        "200":
          description: 空数据库返回 hasEvents=false，且 start/end 为 null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventBounds"
              examples:
                empty:
                  value: { hasEvents: false, start: null, end: null }
        "503":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/event-metadata:
    get:
      operationId: getEventMetadata
      summary: 查询已发布历史事件使用的筛选元数据
      responses:
        "200":
          description: 筛选元数据；空数据库返回全部空数组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventFilterMetadata"
        "503":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/events:
    get:
      operationId: queryEvents
      summary: 查询当前时间范围内的已发布历史事件
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: q
          in: query
          description: 在标题、摘要、正文、地点、历史人物和主题标签中做字面子串搜索；拉丁字符不区分大小写
          schema: { type: string, maxLength: 100 }
        - name: period
          in: query
          schema: { type: array, items: { type: string, format: uuid } }
          explode: true
        - name: region
          in: query
          schema: { type: array, items: { type: string, format: uuid } }
          explode: true
        - name: figure
          in: query
          schema: { type: array, items: { type: string, format: uuid } }
          explode: true
        - name: category
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/PrimaryCategory" }
          explode: true
      responses:
        "200":
          description: 完整查询结果；空数据库返回空 events 和零计数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventQueryResult"
              examples:
                empty:
                  value:
                    events: []
                    sourceTotal: 0
                    totalMatching: 0
                    returnedProminence: 3
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          description: 显著度筛选后超过 5,000 条，必须缩小时间范围
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/events/{eventId}:
    get:
      operationId: getEventById
      summary: 按不可变标识查询已发布历史事件
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 已发布历史事件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalEvent"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: 使用本地邮箱和密码建立服务端会话
      description: 请求必须来自 PUBLIC_BASE_URL 对应的同源页面；成功后设置 HttpOnly Session Cookie 和可读的 CSRF Cookie。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              description: Secure、SameSite=Lax 的 Session 与 CSRF Cookie
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: 邮箱不存在、密码错误或账号停用均返回同一响应
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 撤销当前服务端会话
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: 会话已撤销且 Cookie 已清除
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: 获取当前登录账号和角色
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 当前账号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/change-password:
    post:
      operationId: changeOwnPassword
      summary: 修改当前账号密码并撤销全部会话
      description: 编辑者和管理员均可使用；必须提交当前密码，成功后当前会话也会失效并清除 Cookie。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204":
          description: 密码已修改，账号的全部 Session 已撤销
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/admin:
    get:
      operationId: getAdminBoundary
      summary: 验证管理 API 的统一会话边界
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 已通过管理区认证
          content:
            application/json:
              schema:
                type: object
                required: [status, user]
                properties:
                  status: { type: string, const: authenticated }
                  user: { $ref: "#/components/schemas/CurrentUser" }
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/users:
    get:
      operationId: listManagedUsers
      summary: 列出保留的编辑者和管理员账号
      description: 仅管理员可用；停用账号仍返回，账号不提供物理删除接口。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 账号列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedUserListResponse" }
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createManagedUser
      summary: 创建编辑者或管理员账号
      description: 仅管理员可用；不开放公开注册或邮件找回。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateManagedUserRequest" }
      responses:
        "201":
          description: 账号已创建
          headers:
            Location:
              schema: { type: string }
            ETag:
              description: 账号当前并发版本的强 ETag。
              schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedUser" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/admin/users/{userId}:
    patch:
      operationId: updateManagedUser
      summary: 修改账号角色或停用状态
      description: 仅管理员可用；角色变化或停用会撤销目标账号全部 Session，且不能停用或降级最后一个有效管理员。
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateManagedUserRequest" }
      responses:
        "200":
          description: 账号已更新
          headers:
            ETag:
              description: 账号更新后的强 ETag。
              schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedUser" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/admin/users/{userId}/reset-password:
    post:
      operationId: resetManagedUserPassword
      summary: 重置账号密码并撤销全部会话
      description: 仅管理员可用；服务端不会通过邮件发送或返回密码。
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204":
          description: 密码已重置，账号的全部 Session 已撤销
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/admin/events:
    get:
      operationId: listManagedEvents
      summary: 列出历史事件及其活动草稿
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 管理区历史事件列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedEventListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createManagedEvent
      summary: 创建历史事件和唯一活动草稿
      description: 草稿可以暂时缺少发布必填内容；历史事件标识是不可变 UUIDv7，slug 全局唯一。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateManagedEventRequest" }
      responses:
        "201":
          description: 历史事件及活动草稿已创建
          headers:
            ETag: { schema: { type: string, pattern: '^"draft-[1-9][0-9]*"$' } }
            Location: { schema: { type: string } }
            Idempotency-Replayed: { schema: { type: string, enum: ["true"] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedEvent" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/admin/events/{eventId}:
    get:
      operationId: getManagedEvent
      summary: 查询历史事件和活动草稿
      security:
        - sessionCookie: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 历史事件管理详情；存在活动草稿时 ETag 为草稿版本。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedEvent" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateManagedEventSlug
      summary: 修改历史事件 slug
      security:
        - sessionCookie: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/EventIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateManagedEventSlugRequest" }
      responses:
        "200":
          description: slug 已修改
          headers:
            ETag: { schema: { type: string, pattern: '^"event-[1-9][0-9]*"$' } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedEvent" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/admin/events/{eventId}/draft:
    post:
      operationId: createManagedEventDraft
      summary: 从当前发布版本建立唯一活动草稿
      description: 读者继续读取当前发布版本；已有活动草稿时返回 409，绝不覆盖。
      security:
        - sessionCookie: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "201":
          description: 已从当前发布版本建立活动草稿
          headers:
            ETag: { schema: { type: string, pattern: '^"draft-[1-9][0-9]*"$' } }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedEvent" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: updateManagedEventDraft
      summary: 整体替换唯一活动草稿内容和规范实体关联
      description: '使用 `If-Match: "draft-N"` 防止并发覆盖；过期版本返回 409 和最新 ETag。'
      security:
        - sessionCookie: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/DraftIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventDraftWriteInput" }
      responses:
        "200":
          description: 活动草稿已保存
          headers:
            ETag: { schema: { type: string, pattern: '^"draft-[1-9][0-9]*"$' } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedEvent" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/admin/events/{eventId}/publish:
    post:
      operationId: publishManagedEvent
      summary: 将活动草稿发布为不可变事件版本
      description: 仅管理员可用；发布时重新校验 slug、内容长度、展示顺序、关联数量及规范实体有效状态，关联行锁、版本写入、当前版本切换、公开搜索投影和审计在同一事务中完成。
      security:
        - sessionCookie: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/DraftIfMatch"
      responses:
        "200":
          description: 活动草稿已发布，响应为读者立即可见的当前事件版本
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoricalEvent" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/admin/events/{eventId}/archive:
    post:
      operationId: archiveManagedEvent
      summary: 下线当前已发布的历史事件
      description: 仅管理员可用；保留当前版本和活动草稿，并在同一事务中删除公开搜索投影、切换发布状态和写入审计。已下线事件从所有公开接口及计数中消失。
      security:
        - sessionCookie: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/EventIfMatch"
      responses:
        "200":
          description: 历史事件已下线，管理区仍可读取事件、活动草稿和全部发布版本
          headers:
            ETag: { schema: { type: string, pattern: '^"event-[1-9][0-9]*"$' } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedEvent" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
